<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cytoscape Viewer</title>
  <script src="https://unpkg.com/cytoscape@3.25.0/dist/cytoscape.min.js"></script>
  <style>
    html, body, #cy { width: 100%; height: 100%; margin: 0; }
    #info {
      position: fixed;
      top: 8px;
      left: 8px;
      background: rgba(255,255,255,0.92);
      padding: 8px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      max-width: 45vw;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="info">Click a node or edge…</div>

  <script>
    async function main() {
      const res = await fetch("graph.cyjs");
      const cyjs = await res.json();

      const cy = cytoscape({
        container: document.getElementById("cy"),
        elements: cyjs.elements,
        layout: { name: "cose" },
        style: [
          { selector: "node", style: {
              "label": "data(label)",
              "text-valign": "center",
              "background-color": "#4f7cff",
              "color": "#fff"
          }},
          { selector: "edge", style: {
              "curve-style": "bezier",
              "target-arrow-shape": "triangle",
              "line-color": "#999",
              "target-arrow-color": "#999"
          }}
        ]
      });

      const info = document.getElementById("info");
      cy.on("tap", "node,edge", e => {
        info.textContent = JSON.stringify(e.target.data(), null, 2);
      });
    }

    main();
  </script>
</body>
</html>
